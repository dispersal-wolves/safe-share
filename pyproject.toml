[project]
name = "dispersal-safe-share"
version = "0.1.0"
description = "Temporary token-protected file sharing"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
safe-share = "safe_share:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["safe_share"]
package-dir = {"" = "src"}
